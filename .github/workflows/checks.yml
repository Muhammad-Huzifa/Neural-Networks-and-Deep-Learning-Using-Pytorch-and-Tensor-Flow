name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Check notebook JSON and Python syntax
        run: python scripts/check_notebooks.py --root notebooks
      - name: Check detection CLI arguments
        run: |
          python projects/object_detection/yolo/predict.py --help
          python projects/object_detection/yolo/train.py --help

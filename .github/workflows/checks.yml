name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Check notebook JSON and Python syntax
        run: python scripts/check_notebooks.py --root notebooks
      - name: Check detection CLI arguments
        run: |
          python projects/object_detection/yolo/predict.py --help
          python projects/object_detection/yolo/train.py --help
  cpu-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install self-contained lesson dependencies
        run: python -m pip install -r requirements/validation.txt
      - name: Execute eight lessons in fresh kernels
        run: python scripts/execute_lessons.py
